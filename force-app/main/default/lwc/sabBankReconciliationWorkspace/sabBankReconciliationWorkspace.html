<template>
    <lightning-card
        title="Bank Reconciliation Workspace"
        icon-name="standard:bank"
    >
        <template if:true={isLoading}>
            <lightning-spinner
                alternative-text="Working"
                size="small"
            ></lightning-spinner>
        </template>

        <div class="slds-p-horizontal_medium slds-p-bottom_medium">
            <template if:false={hasCompany}>
                <div
                    class="slds-notify slds-notify_alert slds-alert_info"
                    role="alert"
                >
                    Select an Accounting Company above to use the Bank Reconciliation Workspace.
                </div>
            </template>

            <template if:true={hasCompany}>
                <template if:true={hasDashboard}>
                    <div class="toolbar">
                        <lightning-combobox
                            label="Bank Account"
                            value={selectedBankAccountId}
                            options={bankAccountOptions}
                            onchange={handleBankAccountChange}
                        ></lightning-combobox>

                        <lightning-combobox
                            label="Bank Statement"
                            value={selectedStatementId}
                            options={statementOptions}
                            onchange={handleStatementChange}
                        ></lightning-combobox>

                        <lightning-button
                            label="Refresh"
                            icon-name="utility:refresh"
                            onclick={handleRefresh}
                        ></lightning-button>
                    </div>

                    <div class="summary-grid slds-m-top_medium">
                        <div class="card">
                            <span>Functional Cash</span>
                            <strong>{functionalCashLabel}</strong>
                        </div>
                        <div class="card">
                            <span>Bank Accounts</span>
                            <strong>{dashboard.bankAccountCount}</strong>
                        </div>
                        <div class="card">
                            <span>Statements</span>
                            <strong>{dashboard.statementCount}</strong>
                        </div>
                        <div class="card">
                            <span>In Review</span>
                            <strong>{dashboard.inReviewReconciliationCount}</strong>
                        </div>
                    </div>

                    <lightning-tabset class="slds-m-top_medium" variant="scoped">
                        <lightning-tab label="Cash & Statements">
                            <div class="table-wrap">
                                <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                                    <thead>
                                        <tr>
                                            <th>Bank Account</th>
                                            <th>GL Account</th>
                                            <th>Currency</th>
                                            <th>Book Balance</th>
                                            <th>Latest Statement</th>
                                            <th>Reconciliation</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <template
                                            for:each={dashboard.bankAccounts}
                                            for:item="bank"
                                        >
                                            <tr key={bank.bankAccountId}>
                                                <td>
                                                    <lightning-button
                                                        variant="base"
                                                        label={bank.name}
                                                        data-record-id={bank.bankAccountId}
                                                        onclick={handleOpenRecord}
                                                    ></lightning-button>
                                                </td>
                                                <td>
                                                    {bank.glAccountCode} · {bank.glAccountName}
                                                </td>
                                                <td>{bank.currencyCode}</td>
                                                <td>
                                                    <lightning-formatted-number
                                                        value={bank.currentBookBalance}
                                                        minimum-fraction-digits="2"
                                                        maximum-fraction-digits="4"
                                                    ></lightning-formatted-number>
                                                </td>
                                                <td>
                                                    <template if:true={bank.latestStatementId}>
                                                        <lightning-button
                                                            variant="base"
                                                            label={bank.latestStatementName}
                                                            data-record-id={bank.latestStatementId}
                                                            onclick={handleOpenRecord}
                                                        ></lightning-button>
                                                    </template>
                                                </td>
                                                <td>{bank.latestReconciliationStatus}</td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </div>
                        </lightning-tab>

                        <lightning-tab label="Import Statement">
                            <template if:true={canImport}>
                                <div class="import-grid">
                                    <lightning-input
                                        type="date"
                                        label="Statement Start"
                                        value={importStartDate}
                                        data-field="startDate"
                                        onchange={handleImportHeaderChange}
                                    ></lightning-input>
                                    <lightning-input
                                        type="date"
                                        label="Statement End"
                                        value={importEndDate}
                                        data-field="endDate"
                                        onchange={handleImportHeaderChange}
                                    ></lightning-input>
                                    <lightning-input
                                        type="number"
                                        step="0.0001"
                                        label="Opening Amount"
                                        value={importOpeningAmount}
                                        data-field="openingAmount"
                                        onchange={handleImportHeaderChange}
                                    ></lightning-input>
                                    <lightning-input
                                        type="number"
                                        step="0.0001"
                                        label="Closing Amount"
                                        value={importClosingAmount}
                                        data-field="closingAmount"
                                        onchange={handleImportHeaderChange}
                                    ></lightning-input>
                                    <lightning-input
                                        label="Currency"
                                        value={importCurrencyCode}
                                        data-field="currencyCode"
                                        onchange={handleImportHeaderChange}
                                    ></lightning-input>
                                    <lightning-input
                                        label="Import Fingerprint"
                                        value={importFingerprint}
                                        data-field="importFingerprint"
                                        onchange={handleImportHeaderChange}
                                    ></lightning-input>
                                </div>

                                <div class="section-head slds-m-top_medium">
                                    <h3 class="slds-text-heading_small">
                                        Statement Lines
                                    </h3>
                                    <lightning-button
                                        label="Add Line"
                                        icon-name="utility:add"
                                        onclick={handleAddLine}
                                    ></lightning-button>
                                </div>

                                <div class="table-wrap slds-m-top_small">
                                    <table class="slds-table slds-table_cell-buffer slds-table_bordered import-table">
                                        <thead>
                                            <tr>
                                                <th>#</th>
                                                <th>Transaction Date</th>
                                                <th>Value Date</th>
                                                <th>Amount</th>
                                                <th>Provider Line Id</th>
                                                <th>Reference</th>
                                                <th></th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <template
                                                for:each={importLines}
                                                for:item="line"
                                            >
                                                <tr key={line.key}>
                                                    <td>
                                                        <lightning-input
                                                            type="number"
                                                            variant="label-hidden"
                                                            value={line.lineNumber}
                                                            data-key={line.key}
                                                            data-field="lineNumber"
                                                            onchange={handleImportLineChange}
                                                        ></lightning-input>
                                                    </td>
                                                    <td>
                                                        <lightning-input
                                                            type="date"
                                                            variant="label-hidden"
                                                            value={line.transactionDate}
                                                            data-key={line.key}
                                                            data-field="transactionDate"
                                                            onchange={handleImportLineChange}
                                                        ></lightning-input>
                                                    </td>
                                                    <td>
                                                        <lightning-input
                                                            type="date"
                                                            variant="label-hidden"
                                                            value={line.valueDate}
                                                            data-key={line.key}
                                                            data-field="valueDate"
                                                            onchange={handleImportLineChange}
                                                        ></lightning-input>
                                                    </td>
                                                    <td>
                                                        <lightning-input
                                                            type="number"
                                                            step="0.0001"
                                                            variant="label-hidden"
                                                            value={line.amount}
                                                            data-key={line.key}
                                                            data-field="amount"
                                                            onchange={handleImportLineChange}
                                                        ></lightning-input>
                                                    </td>
                                                    <td>
                                                        <lightning-input
                                                            variant="label-hidden"
                                                            value={line.providerLineId}
                                                            data-key={line.key}
                                                            data-field="providerLineId"
                                                            onchange={handleImportLineChange}
                                                        ></lightning-input>
                                                    </td>
                                                    <td>
                                                        <lightning-input
                                                            variant="label-hidden"
                                                            value={line.reference}
                                                            data-key={line.key}
                                                            data-field="reference"
                                                            onchange={handleImportLineChange}
                                                        ></lightning-input>
                                                    </td>
                                                    <td>
                                                        <lightning-button-icon
                                                            icon-name="utility:delete"
                                                            alternative-text="Remove"
                                                            data-key={line.key}
                                                            onclick={handleRemoveLine}
                                                        ></lightning-button-icon>
                                                    </td>
                                                </tr>
                                            </template>
                                        </tbody>
                                    </table>
                                </div>

                                <div class="actions slds-m-top_medium">
                                    <lightning-button
                                        variant="brand"
                                        label="Import Statement"
                                        onclick={handleImportStatement}
                                        disabled={importDisabled}
                                    ></lightning-button>
                                    <lightning-button
                                        label="Validate Selected Statement"
                                        onclick={handleValidateStatement}
                                        disabled={validateDisabled}
                                    ></lightning-button>
                                </div>
                            </template>
                        </lightning-tab>

                        <lightning-tab label="Match & Review">
                            <template if:true={statementWorkspace}>
                                <div class="section-head">
                                    <div>
                                        <h3 class="slds-text-heading_small">
                                            {statementWorkspace.statementName}
                                        </h3>
                                        <p>
                                            {statementWorkspace.statementStatus}
                                            · {statementWorkspace.currencyCode}
                                        </p>
                                    </div>
                                    <lightning-button
                                        label="Start / Resume Reconciliation"
                                        onclick={handleStartReconciliation}
                                        disabled={startReconciliationDisabled}
                                    ></lightning-button>
                                </div>

                                <div class="table-wrap slds-m-top_medium">
                                    <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                                        <thead>
                                            <tr>
                                                <th>Line</th>
                                                <th>Date</th>
                                                <th>Reference</th>
                                                <th>Amount</th>
                                                <th>Matched</th>
                                                <th>Remaining</th>
                                                <th></th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <template
                                                for:each={statementWorkspace.lines}
                                                for:item="line"
                                            >
                                                <tr key={line.lineId}>
                                                    <td>{line.lineNumber}</td>
                                                    <td>{line.transactionDate}</td>
                                                    <td>{line.reference}</td>
                                                    <td>{line.amount}</td>
                                                    <td>{line.activeMatchedAmount}</td>
                                                    <td>{line.remainingAmount}</td>
                                                    <td>
                                                        <lightning-button
                                                            variant="base"
                                                            label="Find Matches"
                                                            data-line-id={line.lineId}
                                                            onclick={handleFindMatches}
                                                            disabled={line.fullyMatched}
                                                        ></lightning-button>
                                                    </td>
                                                </tr>
                                            </template>
                                        </tbody>
                                    </table>
                                </div>

                                <template if:true={selectedLineId}>
                                    <div class="candidate-panel slds-m-top_medium">
                                        <lightning-input
                                            type="number"
                                            min="0"
                                            max="90"
                                            label="Date Window (days)"
                                            value={candidateDayWindow}
                                            onchange={handleDayWindowChange}
                                        ></lightning-input>

                                        <template if:true={hasCandidates}>
                                            <div class="table-wrap slds-m-top_small">
                                                <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                                                    <thead>
                                                        <tr>
                                                            <th>Date</th>
                                                            <th>Journal</th>
                                                            <th>Amount</th>
                                                            <th>Suggested</th>
                                                            <th></th>
                                                        </tr>
                                                    </thead>
                                                    <tbody>
                                                        <template
                                                            for:each={candidates}
                                                            for:item="candidate"
                                                        >
                                                            <tr key={candidate.journalEntryLineId}>
                                                                <td>{candidate.accountingDate}</td>
                                                                <td>{candidate.journalDescription}</td>
                                                                <td>{candidate.journalAmount}</td>
                                                                <td>{candidate.suggestedMatchAmount}</td>
                                                                <td>
                                                                    <template if:true={canReconcile}>
                                                                        <div class="actions">
                                                                            <lightning-button
                                                                                label="Match"
                                                                                variant="brand"
                                                                                data-journal-line-id={candidate.journalEntryLineId}
                                                                                data-amount={candidate.suggestedMatchAmount}
                                                                                onclick={handleManualMatch}
                                                                            ></lightning-button>
                                                                            <lightning-button
                                                                                label="Propose"
                                                                                data-journal-line-id={candidate.journalEntryLineId}
                                                                                data-amount={candidate.suggestedMatchAmount}
                                                                                onclick={handleProposeMatch}
                                                                            ></lightning-button>
                                                                        </div>
                                                                    </template>
                                                                </td>
                                                            </tr>
                                                        </template>
                                                    </tbody>
                                                </table>
                                            </div>
                                        </template>
                                    </div>
                                </template>

                                <template if:true={hasMatches}>
                                    <div class="table-wrap slds-m-top_medium">
                                        <table class="slds-table slds-table_cell-buffer slds-table_bordered">
                                            <thead>
                                                <tr>
                                                    <th>Type</th>
                                                    <th>Status</th>
                                                    <th>Journal</th>
                                                    <th>Amount</th>
                                                    <th></th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                <template
                                                    for:each={statementWorkspace.matches}
                                                    for:item="match"
                                                >
                                                    <tr key={match.matchId}>
                                                        <td>{match.matchType}</td>
                                                        <td>{match.status}</td>
                                                        <td>{match.journalName}</td>
                                                        <td>{match.matchedAmount}</td>
                                                        <td>
                                                            <template if:true={canReconcile}>
                                                                <div class="actions">
                                                                    <lightning-button
                                                                        label="Confirm"
                                                                        data-match-id={match.matchId}
                                                                        onclick={handleConfirmMatch}
                                                                    ></lightning-button>
                                                                    <lightning-button
                                                                        label="Reverse"
                                                                        data-match-id={match.matchId}
                                                                        onclick={handleReverseMatch}
                                                                    ></lightning-button>
                                                                </div>
                                                            </template>
                                                        </td>
                                                    </tr>
                                                </template>
                                            </tbody>
                                        </table>
                                    </div>
                                </template>
                            </template>
                        </lightning-tab>

                        <lightning-tab label="Finalize">
                            <template if:true={statementWorkspace}>
                                <div class="summary-grid">
                                    <div class="card">
                                        <span>Statement Closing</span>
                                        <strong>{statementWorkspace.closingAmount}</strong>
                                    </div>
                                    <div class="card">
                                        <span>Book Closing</span>
                                        <strong>{statementWorkspace.provisionalBookClosingAmount}</strong>
                                    </div>
                                    <div class="card">
                                        <span>Difference</span>
                                        <strong class={differenceClass}>
                                            {statementWorkspace.provisionalDifference}
                                        </strong>
                                    </div>
                                </div>

                                <div class="actions slds-m-top_medium">
                                    <lightning-button
                                        variant="brand"
                                        label="Finalize Reconciliation"
                                        onclick={handleFinalize}
                                        disabled={finalizeDisabled}
                                    ></lightning-button>
                                </div>

                                <template if:true={finalized}>
                                    <div
                                        class="slds-notify slds-notify_alert slds-alert_success slds-m-top_medium"
                                        role="status"
                                    >
                                        This reconciliation is finalized and the Bank Statement is reconciled.
                                    </div>
                                </template>
                            </template>
                        </lightning-tab>
                    </lightning-tabset>
                </template>

                <template if:true={successMessage}>
                    <div
                        class="slds-notify slds-notify_alert slds-alert_success slds-m-top_medium"
                        role="status"
                    >
                        {successMessage}
                    </div>
                </template>

                <template if:true={errorMessage}>
                    <div
                        class="slds-notify slds-notify_alert slds-alert_error slds-m-top_medium"
                        role="alert"
                    >
                        {errorMessage}
                    </div>
                </template>
            </template>
        </div>
    </lightning-card>
</template>
