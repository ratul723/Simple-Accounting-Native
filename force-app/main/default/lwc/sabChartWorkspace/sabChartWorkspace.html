<template>
    <c-sab-workspace-header company-name={companyName} group="Ledger" heading="Chart of accounts &amp; dimensions"
        description="GL accounts, departments, cost centers, projects and report mappings for this company.">
        <template lwc:if={canImport}><button slot="actions" class="btn sab-import" type="button" onclick={handleImport}><c-sab-icon name="import" size="16"></c-sab-icon>Import accounts</button></template>
        <button slot="actions" class="btn primary sab-new-account" type="button" disabled={manageDisabled} title={manageTitle} onclick={handleNewAccount}>
            <c-sab-icon name="plus" size="16"></c-sab-icon>New account</button>
    </c-sab-workspace-header>

    <template lwc:if={errorMessage}>
        <section class="panel"><div class="empty"><div class="ill"><c-sab-icon name="alert" size="30"></c-sab-icon></div>
            <h3>The chart of accounts could not be loaded</h3><p>{errorMessage}</p>
            <div class="row center"><button class="btn primary" type="button" onclick={handleRetry}>Try again</button></div></div></section>
    </template>
    <template lwc:elseif={showLoading}>
        <section class="panel"><div class="panel-b muted" role="status">Loading the chart of accounts</div></section>
    </template>
    <template lwc:elseif={data}>
        <div class="tabs" role="tablist">
            <template for:each={tabs} for:item="t">
                <button key={t.id} class={t.className} type="button" role="tab" aria-selected={t.selected} data-tab={t.id} onclick={handleTab}>{t.label}
                    <template lwc:if={t.hasCount}><span class="count">{t.count}</span></template></button>
            </template>
        </div>

        <template lwc:if={isGl}>
            <div class="row filters">
                <div class="seg" role="group" aria-label="Account type">
                    <template for:each={typeButtons} for:item="b"><button key={b.id} class={b.className} type="button" aria-pressed={b.pressed} data-id={b.id} onclick={handleType}>{b.label}</button></template>
                </div>
                <span class="spacer"></span><span class="hint">Select an account to inspect or change it.</span>
            </div>
            <section class="panel"><div class="panel-b flush">
                <template lwc:if={hasAccounts}>
                    <div class="tbl-wrap"><table class="tbl sab-accounts">
                        <thead><tr><th>Code</th><th>Account</th><th>Type</th><th>Normal</th><th>Control</th><th class="c">Manual posting</th><th>Report group</th><th class="n">Balance</th></tr></thead>
                        <tbody><template for:each={accountRows} for:item="a"><tr key={a.accountId} class={a.rowClass} tabindex="0" data-id={a.accountId} onclick={handleAccount} onkeydown={handleAccount}>
                            <td><span class="id">{a.code}</span></td><td>{a.name}<template lwc:if={a.inactiveText}><div class="small muted">{a.inactiveText}</div></template></td>
                            <td>{a.accountType}</td><td>{a.normalBalance}</td>
                            <td><template lwc:if={a.hasControl}><span class="tag">{a.controlType}</span></template><template lwc:else><span class="faint">&#8212;</span></template></td>
                            <td class="c"><template lwc:if={a.manualPostingAllowed}><c-sab-icon name="check" size="16"></c-sab-icon></template>
                                <template lwc:else><span class="lock faint" title="Control account"><c-sab-icon name="lock" size="14"></c-sab-icon></span></template></td>
                            <td>{a.reportGroup}</td><td class="n num">{a.balanceText}</td></tr></template></tbody>
                    </table></div>
                </template>
                <template lwc:else><div class="panel-b muted">No accounts of this type.</div></template>
            </div></section>
        </template>

        <template lwc:elseif={isDept}>
            <section class="panel">
                <div class="panel-h"><div><h2>Departments</h2></div><span class="spacer"></span>
                    <button class="btn sm sab-new-department" type="button" disabled={manageDisabled} title={manageTitle} onclick={handleNewDepartment}><c-sab-icon name="plus" size="14"></c-sab-icon>Add department</button></div>
                <div class="panel-b flush">
                    <template lwc:if={hasDepartments}>
                        <div class="tbl-wrap"><table class="tbl sab-departments">
                            <thead><tr><th>Code</th><th>Name</th><th>Parent</th><th>Manager</th><th>Status</th></tr></thead>
                            <tbody><template for:each={departmentRows} for:item="d"><tr key={d.recordId} class="click" tabindex="0" data-kind="department" data-id={d.recordId}
                                onclick={handleDimension} onkeydown={handleDimension}>
                                <td><span class="id">{d.code}</span></td><td>{d.name}</td><td>{d.parentText}</td><td>{d.personText}</td>
                                <td><span class={d.chip}><span class="dot"></span>{d.statusText}</span><div class="small muted">{d.rangeText}</div></td></tr></template></tbody>
                        </table></div>
                    </template>
                    <template lwc:else><div class="panel-b muted">No departments yet.</div></template>
                </div>
            </section>
        </template>

        <template lwc:elseif={isCc}>
            <section class="panel">
                <div class="panel-h"><div><h2>Cost centers</h2></div><span class="spacer"></span>
                    <button class="btn sm sab-new-cost-center" type="button" disabled={manageDisabled} title={manageTitle} onclick={handleNewCostCenter}><c-sab-icon name="plus" size="14"></c-sab-icon>Add cost center</button></div>
                <div class="panel-b flush">
                    <template lwc:if={hasCostCenters}>
                        <div class="tbl-wrap"><table class="tbl sab-cost-centers">
                            <thead><tr><th>Code</th><th>Name</th><th>Owner</th><th>Status</th></tr></thead>
                            <tbody><template for:each={costCenterRows} for:item="d"><tr key={d.recordId} class="click" tabindex="0" data-kind="costCenter" data-id={d.recordId}
                                onclick={handleDimension} onkeydown={handleDimension}>
                                <td><span class="id">{d.code}</span></td><td>{d.name}</td><td>{d.personText}</td>
                                <td><span class={d.chip}><span class="dot"></span>{d.statusText}</span></td></tr></template></tbody>
                        </table></div>
                    </template>
                    <template lwc:else><div class="panel-b muted">No cost centers yet.</div></template>
                </div>
            </section>
        </template>

        <template lwc:elseif={isProj}>
            <div class="banner t-info gap"><c-sab-icon name="info"></c-sab-icon><div><b>Project dimension</b>
                <div class="small">Projects appear as an optional dimension on journal, invoice and bill lines.</div></div>
                <template lwc:if={canOpenProjects}><span class="spacer"></span><button class="btn sm sab-open-projects" type="button" onclick={handleOpenProjects}>Open projects</button></template></div>
            <section class="panel"><div class="panel-b flush">
                <template lwc:if={hasProjects}>
                    <div class="tbl-wrap"><table class="tbl sab-projects">
                        <thead><tr><th>Code</th><th>Name</th><th>Manager</th><th>Status</th></tr></thead>
                        <tbody><template for:each={projectRows} for:item="p"><tr key={p.projectId}><td><span class="id">{p.code}</span></td><td>{p.name}</td><td>{p.managerText}</td>
                            <td><span class={p.chip}><span class="dot"></span>{p.status}</span></td></tr></template></tbody>
                    </table></div>
                </template>
                <template lwc:else><div class="panel-b muted">No projects yet.</div></template>
            </div></section>
        </template>

        <template lwc:else>
            <template lwc:if={hasDefinitions}>
                <div class="row filters"><label class="row small muted gap-label">Definition
                    <select class="select sab-definition" onchange={handleDefinition}>
                        <template for:each={definitionOptions} for:item="o"><option key={o.value} value={o.value} selected={o.selected}>{o.label}</option></template></select></label></div>
                <div class={definition.bannerClass}><c-sab-icon name="info"></c-sab-icon><div><b>{definition.bannerTitle}</b><div class="small">{definition.bannerText}</div></div></div>
                <section class="panel">
                    <div class="panel-h"><div><h2>{definition.title}</h2></div></div>
                    <div class="panel-b flush">
                        <template lwc:if={definition.hasRows}>
                            <div class="tbl-wrap"><table class="tbl sab-mapping">
                                <thead><tr><th>Row</th><th>Mapped accounts</th><th class="c">Sign</th><th class="n">Order</th></tr></thead>
                                <tbody><template for:each={definition.rows} for:item="r"><tr key={r.key}><td><span class="strong">{r.label}</span><div class="small muted">{r.groupLabel}</div></td>
                                    <td><div class="tags"><template for:each={r.accounts} for:item="a"><span key={a.key} class="tag">{a.label}</span></template></div></td>
                                    <td class="c">{r.signText}</td><td class="n num">{r.orderText}</td></tr></template></tbody>
                            </table></div>
                        </template>
                        <template lwc:else><div class="panel-b muted">This definition has no mapped rows yet.</div></template>
                    </div>
                </section>
            </template>
            <template lwc:else><section class="panel"><div class="panel-b muted">No report definitions for this company yet.</div></section></template>
        </template>
    </template>

    <c-sab-modal open={modalOpen} heading={modalHeading} subheading={modalSub} onclose={handleClose}>
        <template lwc:if={formError}><div class="banner t-bad form-error" role="alert"><c-sab-icon name="alert"></c-sab-icon><div>{formError}</div></div></template>
        <template lwc:if={isAccountModal}>
            <div class="grid g2 form">
                <label class="field"><span>Code</span><input class="input" data-field="code" value={form.code} oninput={handleField} /></label>
                <label class="field"><span>Name</span><input class="input" data-field="name" value={form.name} oninput={handleField} /></label>
                <label class="field"><span>Type</span><select class="select" data-field="accountType" onchange={handleField}>
                    <template for:each={typeOptions} for:item="o"><option key={o.value} value={o.value} selected={o.selected}>{o.label}</option></template></select></label>
                <label class="field"><span>Normal balance</span><select class="select" data-field="normalBalance" onchange={handleField}>
                    <template for:each={normalOptions} for:item="o"><option key={o.value} value={o.value} selected={o.selected}>{o.label}</option></template></select></label>
                <label class="field"><span>Control type</span><select class="select" data-field="controlType" onchange={handleField}>
                    <template for:each={controlOptions} for:item="o"><option key={o.value} value={o.value} selected={o.selected}>{o.label}</option></template></select></label>
                <label class="field"><span>Cash flow category</span><select class="select" data-field="cashFlowCategory" onchange={handleField}><option value="">Operating (default)</option>
                    <template for:each={cashFlowOptions} for:item="o"><option key={o.value} value={o.value} selected={o.selected}>{o.label}</option></template></select></label>
                <label class="field"><span>Report group</span><input class="input" data-field="reportGroup" value={form.reportGroup} oninput={handleField} /></label>
                <div class="checks">
                    <label class="check"><input type="checkbox" data-field="isControlAccount" checked={form.isControlAccount} onchange={handleField} />Control account</label>
                    <label class="check"><input type="checkbox" data-field="manualPostingAllowed" checked={form.manualPostingAllowed} onchange={handleField} />Manual posting allowed</label>
                    <label class="check"><input type="checkbox" data-field="isActive" checked={form.isActive} onchange={handleField} />Active</label>
                </div>
            </div>
        </template>
        <template lwc:else>
            <div class="grid g2 form">
                <label class="field"><span>Code</span><input class="input" data-field="code" value={form.code} disabled={isEditing} oninput={handleField} /></label>
                <label class="field"><span>Name</span><input class="input" data-field="name" value={form.name} oninput={handleField} /></label>
                <template lwc:if={isDepartmentModal}>
                    <label class="field"><span>Parent department</span><select class="select" data-field="parentId" onchange={handleField}><option value="">None</option>
                        <template for:each={parentOptions} for:item="o"><option key={o.value} value={o.value} selected={o.selected}>{o.label}</option></template></select></label>
                </template>
                <label class="field"><span>Active from</span><input class="input" type="date" data-field="activeFrom" value={form.activeFrom} oninput={handleField} /></label>
                <label class="field"><span>Active to</span><input class="input" type="date" data-field="activeTo" value={form.activeTo} oninput={handleField} /></label>
                <label class="check"><input type="checkbox" data-field="active" checked={form.active} onchange={handleField} />Active</label>
            </div>
        </template>
        <button slot="footer" class="btn ghost sab-modal-close" type="button" onclick={handleClose}>Cancel</button>
        <button slot="footer" class="btn primary sab-modal-save" type="button" disabled={saving} onclick={handleSave}>Save</button>
    </c-sab-modal>
</template>
