<template>
    <lightning-card
        title="Expense Operations Workspace"
        icon-name="standard:expense"
    >
        <div class="workspace">
            <template if:false={hasCompany}>
                <div class="empty-state">
                    Select an Accounting Company from the SAB Company Context Selector.
                </div>
            </template>

            <template if:true={hasCompany}>
                <div class="header-row">
                    <div>
                        <h2>{companyName}</h2>
                        <p>Functional Currency: {functionalCurrency}</p>
                    </div>

                    <lightning-button
                        label="Refresh"
                        icon-name="utility:refresh"
                        onclick={handleRefresh}
                    ></lightning-button>
                </div>

                <template if:true={isLoading}>
                    <lightning-spinner
                        alternative-text="Loading expense operations"
                        size="medium"
                    ></lightning-spinner>
                </template>

                <template if:true={hasDashboard}>
                    <div class="summary-grid">
                        <div class="metric-card">
                            <span>Draft</span>
                            <strong>{dashboard.draftCount}</strong>
                        </div>
                        <div class="metric-card">
                            <span>Submitted</span>
                            <strong>{dashboard.submittedCount}</strong>
                        </div>
                        <div class="metric-card">
                            <span>Approved</span>
                            <strong>{dashboard.approvedCount}</strong>
                        </div>
                        <div class="metric-card">
                            <span>Posted / Awaiting</span>
                            <strong>{dashboard.postedCount}</strong>
                        </div>
                        <div class="metric-card">
                            <span>Part Paid</span>
                            <strong>{dashboard.partPaidCount}</strong>
                        </div>
                        <div class="metric-card">
                            <span>Paid</span>
                            <strong>{dashboard.paidCount}</strong>
                        </div>
                        <div class="metric-card emphasized">
                            <span>Reimbursement Outstanding</span>
                            <strong>{dashboard.reimbursementOutstanding}</strong>
                        </div>
                    </div>

                    <lightning-tabset>
                        <lightning-tab label="Expense Claims">
                            <div class="panel">
                                <div class="panel-header">
                                    <div>
                                        <h3>Employee Expense Claims</h3>
                                        <p>
                                            Enter claims and lines, submit for review,
                                            approve or reject, and post approved claims.
                                        </p>
                                    </div>

                                    <lightning-button
                                        label="New Claim"
                                        variant="brand"
                                        icon-name="utility:new"
                                        onclick={handleNewClaim}
                                    ></lightning-button>
                                </div>

                                <lightning-datatable
                                    key-field="claimId"
                                    data={claims}
                                    columns={claimColumns}
                                    max-row-selection="1"
                                    selected-rows={selectedClaimRows}
                                    onrowselection={handleClaimSelection}
                                ></lightning-datatable>

                                <template if:true={hasSelectedClaim}>
                                    <div class="selection-card">
                                        <div>
                                            <strong>{selectedClaim.name}</strong>
                                            <span>{claimValidationFeedback}</span>
                                            <span>
                                                Lines: {selectedClaim.lineCount}
                                                · Total: {selectedClaim.totalAmount}
                                                · Remaining: {selectedClaim.remainingAmount}
                                            </span>
                                        </div>

                                        <div class="actions">
                                            <lightning-button
                                                label="Open Claim"
                                                onclick={handleOpenClaim}
                                            ></lightning-button>

                                            <lightning-button
                                                label="Add Claim Line"
                                                onclick={handleAddClaimLine}
                                                disabled={addLineDisabled}
                                            ></lightning-button>

                                            <lightning-button
                                                label="Open Journal"
                                                onclick={handleOpenClaimJournal}
                                            ></lightning-button>
                                        </div>
                                    </div>

                                    <div class="form-grid">
                                        <lightning-input
                                            label="Finance Review / Rejection Reason"
                                            value={reviewReason}
                                            onchange={handleReviewReasonChange}
                                        ></lightning-input>
                                    </div>

                                    <div class="actions">
                                        <lightning-button
                                            label="Submit"
                                            variant="brand"
                                            onclick={handleSubmitClaim}
                                            disabled={submitDisabled}
                                        ></lightning-button>

                                        <lightning-button
                                            label="Approve"
                                            variant="brand"
                                            onclick={handleApproveClaim}
                                            disabled={approveDisabled}
                                        ></lightning-button>

                                        <lightning-button
                                            label="Reject"
                                            variant="destructive-text"
                                            onclick={handleRejectClaim}
                                            disabled={rejectDisabled}
                                        ></lightning-button>

                                        <lightning-button
                                            label="Post"
                                            variant="brand"
                                            onclick={handlePostClaim}
                                            disabled={postDisabled}
                                        ></lightning-button>
                                    </div>
                                </template>
                            </div>
                        </lightning-tab>

                        <lightning-tab label="Lines & Tax">
                            <div class="panel">
                                <h3>Claim Lines & Tax Snapshot</h3>
                                <p>
                                    Select a claim to review expense accounts,
                                    tax codes, taxable base and recoverable tax.
                                </p>

                                <lightning-datatable
                                    key-field="lineId"
                                    data={claimLines}
                                    columns={lineColumns}
                                    hide-checkbox-column
                                ></lightning-datatable>
                            </div>
                        </lightning-tab>

                        <lightning-tab label="Reimbursements">
                            <div class="panel">
                                <div class="panel-header">
                                    <div>
                                        <h3>Employee Reimbursement Payments</h3>
                                        <p>
                                            Authorize, submit and post employee
                                            reimbursement disbursements.
                                        </p>
                                    </div>

                                    <lightning-button
                                        label="New Reimbursement Payment"
                                        variant="brand"
                                        icon-name="utility:new"
                                        onclick={handleNewPayment}
                                    ></lightning-button>
                                </div>

                                <lightning-datatable
                                    key-field="paymentId"
                                    data={payments}
                                    columns={paymentColumns}
                                    max-row-selection="1"
                                    selected-rows={selectedPaymentRows}
                                    onrowselection={handlePaymentSelection}
                                ></lightning-datatable>

                                <template if:true={hasSelectedPayment}>
                                    <div class="selection-card">
                                        <div>
                                            <strong>{selectedPayment.reference}</strong>
                                            <span>
                                                State: {selectedPayment.processingState}
                                                · Remaining: {selectedPayment.remainingAmount}
                                            </span>
                                        </div>

                                        <div class="actions">
                                            <lightning-button
                                                label="Open Payment"
                                                onclick={handleOpenPayment}
                                            ></lightning-button>

                                            <lightning-button
                                                label="Open Journal"
                                                onclick={handleOpenPaymentJournal}
                                            ></lightning-button>
                                        </div>
                                    </div>

                                    <div class="form-grid">
                                        <lightning-input
                                            label="Provider Request Key"
                                            value={providerRequestKey}
                                            onchange={handleProviderKeyChange}
                                        ></lightning-input>
                                    </div>

                                    <div class="actions">
                                        <lightning-button
                                            label="Authorize"
                                            variant="brand"
                                            onclick={handleAuthorizePayment}
                                            disabled={authorizePaymentDisabled}
                                        ></lightning-button>

                                        <lightning-button
                                            label="Submit"
                                            variant="brand"
                                            onclick={handleSubmitPayment}
                                            disabled={submitPaymentDisabled}
                                        ></lightning-button>

                                        <lightning-button
                                            label="Post Payment"
                                            variant="brand"
                                            onclick={handlePostPayment}
                                            disabled={postPaymentDisabled}
                                        ></lightning-button>
                                    </div>
                                </template>
                            </div>

                            <div class="panel">
                                <h3>Settle Selected Claim</h3>
                                <p>
                                    Select a Posted or Part Paid claim and a
                                    Succeeded reimbursement Payment.
                                </p>

                                <div class="form-grid">
                                    <lightning-input
                                        type="number"
                                        step="0.0001"
                                        label="Settlement Amount"
                                        value={settlementAmount}
                                        onchange={handleSettlementAmountChange}
                                    ></lightning-input>

                                    <lightning-input
                                        label="Settlement Key"
                                        value={settlementKey}
                                        onchange={handleSettlementKeyChange}
                                    ></lightning-input>
                                </div>

                                <div class="actions">
                                    <lightning-button
                                        label="Settle Claim"
                                        variant="brand"
                                        onclick={handleSettleClaim}
                                        disabled={settleDisabled}
                                    ></lightning-button>
                                </div>
                            </div>

                            <div class="panel">
                                <h3>Settlement History</h3>

                                <lightning-datatable
                                    key-field="settlementId"
                                    data={settlements}
                                    columns={settlementColumns}
                                    max-row-selection="1"
                                    selected-rows={selectedSettlementRows}
                                    onrowselection={handleSettlementSelection}
                                ></lightning-datatable>

                                <template if:true={hasSelectedSettlement}>
                                    <div class="form-grid">
                                        <lightning-input
                                            label="Reversal Settlement Key"
                                            value={reversalSettlementKey}
                                            onchange={handleReversalSettlementKeyChange}
                                        ></lightning-input>
                                    </div>

                                    <div class="actions">
                                        <lightning-button
                                            label="Reverse Settlement"
                                            variant="destructive"
                                            onclick={handleReverseSettlement}
                                            disabled={reverseSettlementDisabled}
                                        ></lightning-button>
                                    </div>
                                </template>
                            </div>
                        </lightning-tab>
                    </lightning-tabset>
                </template>

                <template if:true={errorMessage}>
                    <div
                        class="slds-notify slds-notify_alert slds-alert_error slds-m-top_medium"
                        role="alert"
                    >
                        {errorMessage}
                    </div>
                </template>
            </template>
        </div>
    </lightning-card>
</template>
